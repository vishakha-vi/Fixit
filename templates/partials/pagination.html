{% load fixit %}
{% if page.has_other_pages %}
<nav aria-label="Pages" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center flex-wrap">
        {% if page.has_previous %}
            <li class="page-item"><a class="page-link" href="?{% query_replace page=page.previous_page_number %}">Previous</a></li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">Previous</span></li>
        {% endif %}
        <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
        {% if page.has_next %}
            <li class="page-item"><a class="page-link" href="?{% query_replace page=page.next_page_number %}">Next</a></li>
        {% else %}
            <li class="page-item disabled"><span class="page-link">Next</span></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
