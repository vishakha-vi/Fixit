{% extends "base.html" %}

{% block title %}Page Not Found (404) - FixIt{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-7">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <div class="display-1 text-primary fw-bold mb-2">404</div>
            <h2 class="h4 fw-bold mb-3">Resource Not Found</h2>
            <p class="text-secondary mb-4">
                The maintenance request, room, or page you were looking for does not exist or is not accessible.
            </p>
            <div>
                <a href="{% url 'home' %}" class="btn btn-outline-primary px-4 fw-semibold">Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
