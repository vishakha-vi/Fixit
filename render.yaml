services:
  - type: web
    name: fixit-web
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fixit-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DEMO_MODE
        value: "True"
      - key: DEMO_PASSWORD
        value: "DemoFixItPass123!"
      - key: APP_VERSION
        value: "0.1.0-render"

databases:
  - name: fixit-db
    plan: free
    databaseName: fixit
    user: fixit_user
